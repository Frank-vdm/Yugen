<svg
    width="1200"
    height="150"
    viewBox="0 0 1200 150"
    xmlns="http://www.w3.org/2000/svg"
    style="background-color:#3A3A46; border-radius:15px;">
  <defs>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0A0E0"/>
      <stop offset="50%" stop-color="#90C0D0"/>
      <stop offset="100%" stop-color="#90B0E0"/>
    </linearGradient>
    <linearGradient id="fuji-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B6B7B" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#4A4A56" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A3A46" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .kanji {
        font-family: 'Georgia', serif;
        fill: url(#text-gradient);
      }
      .label {
        font-family: 'Georgia', serif;
        fill: #E8E0D0
      }
    </style>
  </defs>

  <!-- Sky glow -->
  <ellipse cx="600" cy="380" rx="600" ry="300" fill="#504C6A" opacity="0.2" />

  <!-- Kanji -->
  <text x="620" y="75" font-size="120" dominant-baseline="middle" text-anchor="end" class="kanji">幽玄</text>

  <!-- Romanized -->
  <text x="640" y="80" font-size="56" dominant-baseline="middle" text-anchor="start" class="label">Yūgen</text>
</svg>
