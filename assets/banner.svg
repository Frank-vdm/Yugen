<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" style="background-color:#3A3A46">
  <defs>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0A0E0"/>
      <stop offset="50%" stop-color="#90C0D0"/>
      <stop offset="100%" stop-color="#90B0E0"/>
    </linearGradient>
    <linearGradient id="fuji-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B6B7B" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#4A4A56" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A3A46" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .kanji {
        font-family: 'Georgia', serif;
        fill: url(#text-gradient);
      }
      .label {
        font-family: 'Georgia', serif;
        fill: #E8E0D0
      }
    </style>
  </defs>

  <!-- Sky glow -->
  <ellipse cx="600" cy="450" rx="600" ry="150" fill="#504C6A" opacity="0.2" />

  <!-- Mt. Fuji -->
  <path d="M300,300 C400,150 450,180 500,170 C550,160 600,150 650,160 C700,170 750,180 850,300 L300,300 Z" fill="url(#fuji-gradient)" />

  <!-- Snow cap -->
  <path d="M400,220 C450,180 500,170 550,175 C600,180 650,190 700,230 C675,210 650,200 600,205 C550,210 500,210 450,230
 C433,240 420,230 400,220 Z" fill="#E8E0D0" opacity="0.7" />
  
  <!-- Subtle cloud details -->
  <path d="M250,280 C300,270 350,275 400,285 C500,275 550,285 600,280 C650,275 750,285 850,275 C900,270 950,280 1000,290" stroke="#E8E0D0" stroke-width="1" opacity="0.1" fill="none" />
  
  <!-- Kanji -->
  <text x="620" y="200" font-size="120" dominant-baseline="middle" text-anchor="end" class="kanji">幽玄</text>
  
  <!-- Romanized -->
  <text x="640" y="205" font-size="56" dominant-baseline="middle" text-anchor="start" class="label">Yūgen</text>
</svg>