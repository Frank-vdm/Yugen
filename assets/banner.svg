  <!-- Sky glow -->
  <ellipse cx="600" cy="380" rx="600" ry="300" fill="#504C6A" opacity="0.25" />

  <!-- Moon -->
  <circle cx="950" cy="40" r="22" fill="#E0D8E8" opacity="0.4" filter="url(#soft-glow)" style="paint-order: stroke; stroke: rgba(255,255,255,0.1); stroke-width: 0.6;"/>

  <!-- Mist/Clouds -->
  <path opacity="0.5" d="M750,80 C800,65 850,90 900,75 S950,85 1000,70 S1050,80 1100,65" fill="none" stroke="rgba(230,230,240,0.15)" stroke-width="12" filter="url(#ink-dispersion)" stroke-linecap="round" stroke-linejoin="round"/>
  <path opacity="0.5" d="M800,100 C850,85 900,95 950,80 S1000,90 1050,80 S1100,95 1150,85" fill="none" stroke="rgba(230,230,240,0.12)" stroke-width="10" filter="url(#ink-dispersion)" stroke-linecap="round" stroke-linejoin="round"/>
  <path opacity="0.5" d="M860,60 C890,50 920,55 950,45 S1000,50 1040,40" fill="none" stroke="rgba(230,230,240,0.18)" stroke-width="8" filter="url(#ink-dispersion)" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stars -->
  <circle cx="150" cy="30" r="1" fill="#E0D8E8" opacity="0.7"/>
  <circle cx="380" cy="25" r="1.2" fill="#E0D8E8" opacity="0.8"/>
  <circle cx="450" cy="40" r="0.8" fill="#E0D8E8" opacity="0.6"/>
  <circle cx="200" cy="70" r="1" fill="#E0D8E8" opacity="0.7"/>
  <circle cx="320" cy="15" r="0.9" fill="#E0D8E8" opacity="0.6"/>
  <circle cx="600" cy="20" r="1.1" fill="#E0D8E8" opacity="0.8"/>
  <circle cx="680" cy="35" r="0.7" fill="#E0D8E8" opacity="0.6"/>
  <circle cx="500" cy="60" r="1" fill="#E0D8E8" opacity="0.7"/>
  <circle cx="550" cy="25" r="0.8" fill="#E0D8E8" opacity="0.6"/>
  <!-- Kanji -->
  <text x="620" y="75" font-size="120" dominant-baseline="middle" text-anchor="end" class="kanji">幽玄</text>

  <!-- Romanji -->
  <text x="640" y="80" font-size="56" dominant-baseline="middle" text-anchor="start" class="romanji">Yūgen</text>
</svg>
