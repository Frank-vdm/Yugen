<svg
    width="1200"
    height="150"
    viewBox="0 0 1200 150"
    xmlns="http://www.w3.org/2000/svg"
    style="background-color:#3A3A46; border-radius:15px;">
  <defs>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B0A0E0"/>
      <stop offset="50%" stop-color="#90C0D0"/>
      <stop offset="100%" stop-color="#90B0E0"/>
    </linearGradient>
    <linearGradient id="fuji-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A8A9A" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#6A6A76" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3A3A46" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="brush-texture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ink-dispersion" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="1" result="noise" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <style>
      .kanji {
        font-family: 'Georgia', serif;
        fill: url(#text-gradient);
      }
      .romanji {
        font-family: 'Georgia', serif;
        fill: #E8E0D0
      }
    </style>
  </defs>
    <!-- Mountain -->
    <path
       opacity="0.3"
